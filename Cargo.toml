[package]
name = "sre-audit"
version = "0.1.0"
edition = "2021"

[lib]
name = "sre_audit"
path = "src/lib.rs"

[[bin]]
name = "sre-audit"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2

[dependencies]
dioxus = { version = "=0.7.10", features = ["web", "router", "asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-storage = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
reqwest = { version = "0.12", features = ["json"] }
web-sys = { version = "0.3", features = [
    "Window", "Navigator", "Document", "Element", "Storage",
    "HtmlScriptElement", "HtmlElement", "HtmlAnchorElement", "Blob", "Url",
    "HtmlInputElement", "Event",
] }